# source with `tmux source-file ~/.tmux.conf`


# Remove the default prefix and set a new prefix
unbind C-b
set -g prefix C-a
# press C-a twice to send C-a to the program (e.g. start of line)
bind C-a send-prefix

# splits are w/ " for vertical and  % for horizontal
# preserve path in the new window and panes
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# DISPLAY (and SSH_AUTH_SOCK etc.) are updated on re-attach by tmux's default update-environment
# when problem w/ xclip on tmux when ssh-ing it's possibly
# because the DISPLAY is not set properly.
# check: echo $DISPLAY and tmux show-environment | grep DISPLAY
# export manually the display from the command output in the panes,
# and it will work.

# copy mode (C-a [): v starts a selection, C-v toggles a block selection, y copies.
# Copies go to the system clipboard through xclip (GNOME Terminal ignores OSC 52);
# set-clipboard also sends OSC 52, so over ssh a terminal that supports it (kitty) gets the copy
set -s copy-command 'xclip -selection clipboard -in'
set -g set-clipboard on
set -g allow-passthrough on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

# pane border colors
set -g window-style bg=default
set -g window-active-style bg=default
set -g pane-border-style fg=colour2
set -g pane-active-border-style fg=colour208
# new suggestions to try
set -g pane-border-lines heavy
set -g pane-border-indicators both


# enable aggressive resize option
set-window-option -g aggressive-resize on
# set-window-size -g smallest # latest

# Colours in vim
# problem w/ ctrl-Arrow not working so use xterm instead
set -g default-terminal "xterm-256color"
# set -ga terminal-overrides ",xterm-kitty:Tc" kitty not configured yet

# Ctrl+left/right key to move within line
set-window-option -g xterm-keys on

# Use vi keys for movement
set-window-option -g mode-keys vi

# Enable mouse support
set -g mouse on

# Scroll with mouse wheel in copy mode
bind -T root WheelUpPane   if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"


# Increase history limit
set-option -g history-limit 1048576

# Escape key takes a while to have an effect without this
set -s escape-time 0

# a mouse drag selects inside the pane only and copies it, without jumping to the bottom
# (hold Shift to use the terminal's own selection instead, across panes)
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
