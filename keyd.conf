# keyd: system-wide key remapping (X, Wayland and the console). Optional, see README.md.
# Installed as /etc/keyd/default.conf; reload with `sudo keyd reload`.

[ids]
*

[main]
# tap = Escape, hold = Control (alternatives: `capslock = esc` or `capslock = control`)
capslock = overload(control, esc)
rightalt = insert
